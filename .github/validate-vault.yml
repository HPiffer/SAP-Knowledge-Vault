name: Validar SAP Knowledge Vault

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório e arquivos LFS
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validar cofre
        run: npm test